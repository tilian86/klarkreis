name: Supabase Keep-Alive

# Verhindert, dass das Free-Tier-Projekt nach 7 Tagen Inaktivität pausiert.
#
# Lektion vom 18.09.2026: Bis dahin schickte dieser Job täglich einen
# LESE-Request. Er lief jeden Tag sauber durch – und Supabase schickte am
# 10.09. trotzdem die Pause-Warnung (beim Schwesterprojekt „leselog" wurde
# die Pause am 18.09. sogar vollzogen, trotz grünem Ping). Ein Lesezugriff,
# den RLS auf eine leere Antwort reduziert, zählt dort nicht als
# „ausreichende Aktivität".
#
# Darum jetzt ein echter SCHREIBzugriff: die RPC-Funktion keepalive_ping()
# setzt einen Zeitstempel in der einzeiligen Tabelle public.keepalive.
# Das erzeugt WAL und ist damit unbestreitbar Datenbank-Aktivität.
#
# Bewusst ohne Geheimnis: keepalive_ping() ist security definer und kann
# NUR diese eine feste Zeile anfassen – die Tabelle selbst ist für anon
# per RLS gesperrt, es gibt keinen Datenzugriff und nichts kann wachsen.
#
# Zweite, unabhängige Sicherung läuft auf dem Funk-Server
# (~/bin/supabase-keepalive.sh) – GitHubs Zeitplan wird unter Last gerne
# um Stunden verschleppt oder ganz übersprungen.

on:
  schedule:
    - cron: "9 3 * * *"       # täglich ~03:09 UTC; krumme Minute = weniger Verzug
  workflow_dispatch:           # manueller Trigger im UI

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase anpingen (Schreibzugriff)
        env:
          SUPABASE_URL: https://liqnavdghqhhavgkhgpx.supabase.co
          # Publishable Anon-Key – steht clientseitig sowieso in config.js
          SUPABASE_ANON_KEY: sb_publishable_5lEVXLCtoG6yvY1w-Q5Xcw_Y9V46rjy
        run: |
          set -u
          # Bis zu 3 Versuche, damit kurze Cloudflare-Hänger (521/522)
          # keine Fehl-Mails auslösen.
          attempt=0
          max_attempts=3
          while : ; do
            attempt=$((attempt+1))
            status=$(curl -s -o /tmp/resp.txt -w "%{http_code}" \
              --max-time 30 -X POST \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Content-Type: application/json" \
              -d '{}' \
              "$SUPABASE_URL/rest/v1/rpc/keepalive_ping" || echo "000")
            echo "Versuch $attempt → HTTP $status"
            if [ "$status" = "200" ]; then
              echo "✓ Schreib-Ping gesetzt: $(cat /tmp/resp.txt)"
              exit 0
            fi
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::Keep-Alive fehlgeschlagen (HTTP $status) – Projekt pausiert?"
              head -c 500 /tmp/resp.txt; echo
              exit 1
            fi
            echo "  → 60s warten und erneut versuchen…"
            sleep 60
          done
